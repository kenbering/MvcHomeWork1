<title>Spelling Bee 1A 單字卡</title>

<style>

header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:8px}
h1{font-family:var(--en);font-size:1.9rem;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--zh);font-size:.95rem;color:var(--muted);font-weight:400;margin-top:2px}
.stats{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--leaf)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--surface);color:var(--ink);

  transform-style:preserve-3d;transition:transform .45s ease}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;background:var(--surface);
  border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;

.back{transform:rotateY(180deg);background:var(--honey-soft);border-color:var(--honey)}
.tag{position:absolute;top:14px;left:18px;font-size:.85rem;color:var(--muted);font-family:var(--en);letter-spacing:.05em}
.status{position:absolute;top:12px;right:16px;font-size:.85rem;padding:3px 10px;border-radius:999px}
.status.known{background:var(--leaf);color:#fff}
.word{font-family:var(--en);font-weight:700;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;letter-spacing:.02em;overflow-wrap:anywhere}
.emoji{font-size:clamp(2.6rem,10vw,3.6rem);line-height:1}
.zh{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700}
.ex{font-family:var(--en);font-size:clamp(1.05rem,3.6vw,1.3rem);max-width:30ch}
.ex mark{background:none;color:var(--berry);font-weight:700}
.hint{font-size:.85rem;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav .count{font-family:var(--en);font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:center;min-width:5ch}
.nav button.big{font-size:1.15rem;padding:12px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{border-radius:16px;font-weight:700}
.judge .yes{border-color:var(--leaf);color:var(--leaf)}
.judge .no{border-color:var(--berry);color:var(--berry)}
.spell{background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 10px 0 var(--line)}
.spell input{font-family:var(--en);font-size:2rem;text-align:center;width:100%;max-width:420px;padding:10px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.result{font-size:1.2rem;font-weight:700;min-height:1.6em}
.result.ok{color:var(--leaf)} .result.bad{color:var(--berry)}
.result .ans{font-family:var(--en);letter-spacing:.08em}
details{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:10px}
.list button{border:none;padding:4px 0;min-height:0;text-align:left;border-radius:6px;font-family:var(--en);font-size:1.05rem;background:none}

.cvc .syl{color:var(--ink)}

:root{--c:#2563c9;--v:#d63a3a;--m:#8b4fd6;--s:#a9a9b3}

.syl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 6px}
.syl + .syl{border-left:3px dotted var(--line)}
.units{display:flex;align-items:flex-end}
.u{display:flex;flex-direction:column;align-items:center;padding:0 1px}
.u b{line-height:1.05}
.u i{font-style:normal;font-size:.28em;font-weight:700;margin-top:2px;border-top:3px solid currentColor;padding:1px 3px 0;min-width:100%;text-align:center;font-family:var(--en)}

.u.L{color:var(--c)}
.chip{font-family:var(--zh);font-size:.82rem;font-weight:700;line-height:1.2;padding:3px 8px;border-radius:999px;background:var(--bg);border:2px solid var(--line);color:var(--ink);white-space:nowrap}

.front .cvc{font-size:clamp(2.1rem,9vw,3.8rem)}
.back .cvc{font-size:clamp(1.5rem,6vw,2.2rem)}
.spell .cvc{font-size:clamp(1.6rem,7vw,2.4rem)}
.plain .u i,.plain .chip{visibility:hidden}
.plain .u{color:var(--ink)!important}.plain .u.S b{text-decoration:none}
.plain .syl + .syl{border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;align-items:center}
.legend span b{font-family:var(--en);font-size:1.05rem}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px;font-size:.92rem}
.types div{min-width:0}
.types b{display:block}
.card{aspect-ratio:auto;min-height:340px}
</style>

<div class="wrap">

  <details>
    <summary>單字總表（點單字跳過去）</summary>
    <div class="list" id="list"></div>
  </details>
</div>

function parseSyl(s){
  const u=[];let i=0,sil=false;
  const push=(t,k)=>{u.push({t,k:sil?"S":k});sil=false};
  while(i<s.length){
    const ch=s[i];
    if(ch==="!"){sil=true;i++;continue}
    if(ch==="+"){u.push({t:"e",k:"M"});i+=2;continue}
    if(ch==="%"){u.push({t:"le",k:"L"});i+=3;continue}
    if(ch==="["||ch==="{"){const end=s.indexOf(ch==="["?"]":"}",i);push(s.slice(i+1,end),ch==="["?"V":"C");i=end+1;continue}
    const k="aeiou".includes(ch)?"V":(ch==="y"?(u.length?"V":"C"):"C");
    push(ch,k);i++;
  }
  const live=u.filter(x=>x.k!=="S");
  let pat=live.map(x=>x.k==="M"?"e":x.k==="L"?"le":x.k).join("");
  let type;
  if(u.some(x=>x.k==="L")) type="子音+le";
  else if(u.some(x=>x.k==="M")) type="魔法 e";
  else if(u.some(x=>x.k==="V"&&x.t.length>1&&/r$/.test(x.t))) type="r 控制";
  else if(u.some(x=>x.k==="V"&&x.t.length>1)) type="母音組合";
  else if(live.length&&live[live.length-1].k==="V") type="開音節";
  else type="閉音節";
  return {u,pat,type};
}
function cvcHTML(w){
  const code=CODE[w]||w;
  return code.split("-").map(syl=>`<span class="syl">${syl.replace(/[\[\]{}!+%]/g,"")}</span>`).join("");
}
let showCVC=true;
const $=id=>document.getElementById(id);
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("sb1a-known")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("sb1a-known",JSON.stringify([...known]))}catch(e){}};
let part=0, order=[], pos=0, mode="card", onlyNew=false;

function build(shuffle){
  order=words.filter(x=>(!part||x.p===part)&&(!onlyNew||!known.has(x.w))).map(x=>x.i);
  if(shuffle) for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  pos=0; render();
}
function cur(){return words[order[pos]]}
function render(){
  const c=cur();
  $("card").classList.remove("flip");
  $("stats").innerHTML=`已會 <b>${known.size}</b> / 100`;
  if(!c){$("count").textContent="0 / 0";$("fWord").textContent="全部都會了！";$("fEmoji").textContent="🏆";$("fTag").textContent="";$("fStatus").textContent="";$("fStatus").className="status";
    $("sZh").textContent="全部都會了！";$("sEmoji").textContent="🏆";renderList();return}
  $("count").textContent=`${pos+1} / ${order.length}`;
  const tag="Part "+c.p;
  $("fTag").textContent=tag;$("bTag").textContent=tag;
  $("fEmoji").textContent=c.e;$("fWord").innerHTML=cvcHTML(c.w);$("sBreak").innerHTML=cvcHTML(c.w);$("sBreak").hidden=true;
  $("fStatus").textContent=known.has(c.w)?"會了 ⭐":"";$("fStatus").className="status"+(known.has(c.w)?" known":"");
  $("bWord").innerHTML=cvcHTML(c.w);$("bZh").textContent=c.zh;$("bEx").innerHTML=c.ex;
  $("sEmoji").textContent=c.e;$("sZh").textContent=c.zh;$("sInput").value="";$("sResult").textContent="";$("sResult").className="result";
  renderList();
}
function renderList(){
  $("list").innerHTML=words.filter(x=>!part||x.p===part).map(x=>`<button data-i="${x.i}" class="${known.has(x.w)?"k":""}">${x.w}<span>${x.zh.split("；")[0]}</span></button>`).join("");
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function go(d){if(!order.length)return;pos=(pos+d+order.length)%order.length;render();if(mode==="spell")$("sInput").focus()}

// part tabs
["全部",1,2,3,4].forEach((p,k)=>{const b=document.createElement("button");b.textContent=k?`Part ${p}`:p;b.className=k===0?"on":"";
  b.onclick=()=>{part=k;[...$("parts").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");build(false)};$("parts").appendChild(b)});

$("card").onclick=()=>$("card").classList.toggle("flip");
$("card").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("card").classList.toggle("flip")}};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("shuffle").onclick=()=>build(true);
$("onlyNew").onclick=()=>{onlyNew=!onlyNew;$("onlyNew").classList.toggle("on",onlyNew);build(false)};
$("yes").onclick=()=>{const c=cur();if(!c)return;known.add(c.w);save();if(onlyNew){order.splice(pos,1);if(pos>=order.length)pos=0;render()}else go(1)};
$("no").onclick=()=>{const c=cur();if(!c)return;known.delete(c.w);save();go(1)};
$("say").onclick=()=>{const c=cur();if(c)speak(c.w)};
$("sSay").onclick=()=>{const c=cur();if(c)speak(c.w)};
function setMode(m){mode=m;$("mCard").classList.toggle("on",m==="card");$("mSpell").classList.toggle("on",m==="spell");
  $("cardMode").hidden=m!=="card";$("spellMode").hidden=m!=="spell";render();if(m==="spell"){const c=cur();if(c)speak(c.w);$("sInput").focus()}}
$("mCard").onclick=()=>setMode("card");$("mSpell").onclick=()=>setMode("spell");
function check(){const c=cur();if(!c)return;const v=$("sInput").value.trim().toLowerCase();const r=$("sResult");
  if(!v)return;
  if(v===c.w){r.className="result ok";r.innerHTML="答對了！太棒了 🎉";$("sBreak").hidden=false;known.add(c.w);save();$("stats").innerHTML=`已會 <b>${known.size}</b> / 100`;renderList();setTimeout(()=>{go(1);if(mode==="spell"){const n=cur();if(n)speak(n.w)}},1100)}
  else{r.className="result bad";r.innerHTML="再試一次 💪";}}
$("sCheck").onclick=check;
$("cvcBtn").onclick=()=>{showCVC=!showCVC;$("cvcBtn").classList.toggle("on",showCVC);document.querySelector(".wrap").classList.toggle("plain",!showCVC)};
$("sInput").onkeydown=e=>{if(e.key==="Enter")check()};
$("sShow").onclick=()=>{const c=cur();if(!c)return;$("sResult").className="result";$("sResult").innerHTML=`答案：<span class="ans">${c.w.split("").join(" ")}</span>`;$("sBreak").hidden=false};
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;let k=order.indexOf(i);
  if(k<0){onlyNew=false;$("onlyNew").classList.remove("on");build(false);k=order.indexOf(i)}pos=k;render();window.scrollTo({top:0,behavior:"smooth"})};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
build(false);
